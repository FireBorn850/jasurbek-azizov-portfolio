    <title>Jasurbek Azizov | Portfolio</title>
    <!-- Apply the saved theme before the page paints, so light-mode visitors don't see a dark flash -->
    <script>
      try {
        var t = localStorage.getItem('ja_portfolio_theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
